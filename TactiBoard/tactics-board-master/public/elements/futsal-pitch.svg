<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4500 2500">
  <style>
    .player {
      fill: red;
      cursor: pointer;
    }
    .player text {
      fill: black;
    }
    .player text.number {
      fill: white;
      font-weight: bold;
    }
  </style>
  <pattern id="goal-net" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="20" y2="20" stroke="gray" />
    <line x1="20" y1="0" x2="0" y2="20" stroke="gray" />
  </pattern>
  <g id="background">
    <rect width="4500" height="2500" fill="#4CAF50" />
  </g>
  <g id="pitch" transform="translate(250 200)" fill="none" stroke="white" stroke-width="8">
    <rect width="4000" height="2000" fill="#388E3C" />
    <line x1="2000" x2="2000" y1="0" y2="2000" />
    <circle r="300" cx="2000" cy="1000" />
    <circle r="12" cx="2000" cy="1000" fill="white" stroke="none" />
    
    <!-- Corner arcs -->
    <path d="M0,0 A50,50 0 0,1 50,50" />
    <path d="M4000,0 A50,50 0 0,0 3950,50" />
    <path d="M0,2000 A50,50 0 0,0 50,1950" />
    <path d="M4000,2000 A50,50 0 0,1 3950,1950" />

    <!-- Left penalty area -->
    <rect x="0" y="600" width="600" height="800" />
    <rect x="0" y="800" width="200" height="400" />
    <circle cx="600" cy="1000" r="12" fill="white" stroke="none" />

    <!-- Right penalty area -->
    <rect x="3400" y="600" width="600" height="800" />
    <rect x="3800" y="800" width="200" height="400" />
    <circle cx="3400" cy="1000" r="12" fill="white" stroke="none" />

    <!-- Goals -->
    <g id="goal-left">
      <rect x="-100" y="850" width="100" height="300" fill="url(#goal-net)" stroke="#777" stroke-width="4" />
    </g>
    <g id="goal-right">
      <rect x="4000" y="850" width="100" height="300" fill="url(#goal-net)" stroke="#777" stroke-width="4" />
    </g>
  </g>
  <g id="players" transform="translate(250 2250)" font-size="50">
    <g id="player-01" text-anchor="middle" class="player">
      <circle r="50" cx="50" cy="70" />
      <text class="number" x="50" y="70" dominant-baseline="central" text-anchor="middle">0</text>
      <text x="50" y="150" text-anchor="middle">Goran Test</text>
    </g>
  </g>
</svg>
