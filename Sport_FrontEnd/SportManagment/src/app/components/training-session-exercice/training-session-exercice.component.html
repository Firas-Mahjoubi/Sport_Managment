<div class="container mt-4">
    <h2 class="text-center text-primary mb-4">🏋️ Training Sessions</h2>
  
    <div *ngIf="trainingSessions.length === 0" class="text-center">
      <p class="text-muted">No training sessions available.</p>
    </div>
  
    <div class="row">
      <div class="col-md-6 mb-4" *ngFor="let session of trainingSessions">
        <div class="card shadow-lg">
          <div class="card-body">
            <h5 class="card-title text-primary">{{ session.name }}</h5>
            <p class="card-text text-muted">{{ session.description }}</p>
            <p><strong>📅 Date:</strong> {{ session.date }}</p>
            <p><strong>📍 Location:</strong> {{ session.location }}</p>
  
            <h6 class="mt-3">🏆 Selected Exercises</h6>
            <div *ngIf="session.exercices.length > 0; else noExercises">
              <ul class="list-group">
                <li *ngFor="let exercise of session.exercices" class="list-group-item d-flex align-items-center">
                  <img [src]="exercise.imageUrl ? exercise.imageUrl : 'https://img.freepik.com/photos-premium/spheres-football-3d-raffinees-balles-football-blanches-noires-surface-grise-elegante_1031658-231.jpg?semt=ais_hybrid'" 
                       class="rounded-circle me-2" width="50" height="50">
                  {{ exercise.name }}
                </li>
              </ul>
            </div>
            <ng-template #noExercises>
              <p class="text-muted">No exercises added.</p>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
