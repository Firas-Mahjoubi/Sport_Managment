<div class="container mt-4">
  <h2 class="text-center text-primary mb-4">🏋️ Training Sessions</h2>

  <div *ngIf="trainingSessions.length === 0" class="text-center">
    <p class="text-muted">No training sessions available.</p>
  </div>

  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let session of trainingSessions">
      <div class="card shadow-lg border-0">
        <div class="card-body">
          <h5 class="card-title text-primary fw-bold">
            {{ session.name }} 
            <span class="badge bg-secondary ms-2">{{ session.intensity }}</span>
          </h5>
          
          <p class="card-text text-muted"><i class="fas fa-map-marker-alt"></i> {{ session.location }}</p>
          <p><i class="fas fa-calendar-alt text-danger"></i> <strong>Date:</strong> {{ session.date }}</p>

          <!-- 🏆 Selected Exercises -->
          <h6 class="mt-3"><i class="fas fa-dumbbell text-success"></i> Selected Exercises</h6>

          <div *ngIf="session.exercices.length > 0; else noExercises">
            <div class="d-flex flex-wrap">
              <div *ngFor="let exercise of session.exercices" class="p-2">
                <div class="exercise-card d-flex align-items-center">
                  <img 
                    [src]="exercise.imageUrl ? exercise.imageUrl : 'https://img.freepik.com/photos-premium/spheres-football-3d-raffinees-balles-football-blanches-noires-surface-grise-elegante_1031658-231.jpg?semt=ais_hybrid'"
                    class="rounded-circle border border-dark"
                    width="50"
                    height="50"
                    alt="Exercise Image"
                  />
                  <span class="ms-2">{{ exercise.name }}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 🚨 Empty Exercise Placeholder -->
          <ng-template #noExercises>
            <p class="text-muted"><i class="fas fa-exclamation-triangle"></i> No exercises added.</p>
          </ng-template>

          <!-- 📋 View Button -->
          <a [routerLink]="['/training-session', session.id]" class="btn btn-outline-primary w-100 mt-3">
            📋 View Details
          </a>

        </div>
      </div>
    </div>
  </div>
</div>
