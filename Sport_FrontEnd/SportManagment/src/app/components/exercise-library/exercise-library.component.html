<div class="container drill-library-container">
  <!-- Header with Title & Button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="col-12 title-section">
      <h2 class="heading">Training Exercises</h2>
    </div>
    <button class="btn btn-success" routerLink="/add-exercise">+ Create Drill</button>
  </div>

  <!-- Search & Filter Controls -->
  <div class="row g-3">
    <div class="col-md-8">
      <input type="text" class="form-control" placeholder="🔍 Search drills..." [(ngModel)]="searchQuery">
    </div>
    <div class="col-md-4">
      <select class="form-control" [(ngModel)]="sortBy">
        <option value="mostRecent">Public</option>
        <option value="popular">Private</option>
      </select>
    </div>
  </div>
  
  <!-- Drill Grid Layout -->
  <div class="row mt-4">
    <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let exercise of filteredExercises">
      <div class="custom-media d-block shadow-lg p-3 rounded">
        <!-- Image Section -->
        <div class="position-relative">
          <img [src]="exercise.imageUrl ? exercise.imageUrl : defaultImage" class="card-img-top" alt="Drill Image">
          <div class="overlay d-flex justify-content-center align-items-center">
            <i class="fas fa-plus-circle me-3 text-success" title="Add to Training"></i>
            <i class="fas fa-heart text-danger" title="Favorite"></i>
          </div>
        </div>

        <!-- Card Body -->
        <div class="card-body text-center">
          <h5 class="fw-bold">{{ exercise.name }}</h5>
          <p class="text-muted">By Coach</p>
          <button class="btn btn-outline-primary w-100">View Details</button>
        </div>
      </div>
    </div>
  </div>
</div>
