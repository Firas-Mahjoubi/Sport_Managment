<app-header></app-header>
<br>
<br>
<div class="container mt-5 site-section">
  <div class="col-12 title-section">
    <h2 class="heading">Training Sessions</h2>
  </div>
  <!-- No Sessions Available -->
  <div *ngIf="trainingSessions.length === 0" class="text-center">
    <p class="text-muted">No training sessions available.</p>
  </div>

  <div class="row">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let session of trainingSessions">
      <div class="card session-card bg-dark text-light shadow-lg border-0 d-flex flex-column">

        <div class="card-body d-flex flex-column justify-content-between">
          <h5 class="mb-4 fw-bold text-danger">
            {{ session.name }}
            <span class="badge bg-secondary ms-2">{{ session.intensity }}</span>
          </h5>

          <p class="card-text">
            <i class="fas fa-map-marker-alt text-light"></i> {{ session.location }}
          </p>
          <p>
            <i class="fas fa-calendar-alt text-danger"></i> <strong>Date:</strong> {{ session.date }}
          </p>

          <!-- 🏆 Selected Exercises -->
          <h6 class="mt-3"><i class="fas fa-dumbbell text-success"></i> Selected Exercises</h6>

          <div *ngIf="session.exercices.length > 0; else noExercises">
            <div class="d-flex flex-wrap">
              <div *ngFor="let exercise of session.exercices" class="p-2">
                <div class="exercise-card d-flex align-items-center">
                  <img
                    [src]="exercise.imageUrl ? exercise.imageUrl : defaultImage"
                    class="rounded-circle border border-light"
                    width="50"
                    height="50"
                    alt="Exercise Image"
                  />
                  <span class="ms-2 text-light">{{ exercise.name }}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 🚨 No Exercises Placeholder -->
          <ng-template #noExercises>
            <p class="text-muted"><i class="fas fa-exclamation-triangle"></i> No exercises added.</p>
          </ng-template>

          <!-- Button -->
          <div class="button-group mt-3">
            <button class="btn btn-primary text-white" (click)="navigateToSession(session.id)">
              📋 View Details
            </button>
            
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
