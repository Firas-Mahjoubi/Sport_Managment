<app-header></app-header>
<br><br><br><br><br><br>

<div class="container mt-4">
    <div class="form-container">
        <h2 class="text-center mb-4">🏋️ Create Training Session</h2>

        <form (ngSubmit)="saveSession()">
            <div class="form-group">
                <label>Session Name *</label>
                <input type="text" class="form-control" [(ngModel)]="trainingSession.name" name="name" required>
            </div>

            <div class="form-group mt-3">
                <label>Intensity</label>
                <select class="form-control" [(ngModel)]="trainingSession.intensity" name="intensity">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <div class="form-group mt-3">
                <label>Category</label>
                <select class="form-control" [(ngModel)]="trainingSession.category" name="category">
                    <option value="Attacking">Attacking</option>
                    <option value="Tactical">Tactical</option>
                    <option value="Physical">Physical</option>
                </select>
            </div>

            <div class="form-group mt-3">
                <label>Date *</label>
                <input type="date" class="form-control" [(ngModel)]="trainingSession.date" name="date" required>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mt-3">
                        <label>Start Time *</label>
                        <input type="time" class="form-control" [(ngModel)]="trainingSession.startTime" name="startTime" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mt-3">
                        <label>End Time *</label>
                        <input type="time" class="form-control" [(ngModel)]="trainingSession.endTime" name="endTime" required>
                    </div>
                </div>
            </div>

            <div class="form-group mt-3">
                <label>Location</label>
                <input type="text" class="form-control" [(ngModel)]="trainingSession.location" name="location">
            </div>

            <!-- 👥 Player Attendance -->
            <div class="row mt-3">
                <div class="col-md-4">
                    <label>✅ Attending Players</label>
                    <input type="number" class="form-control" [(ngModel)]="trainingSession.attendingPlayers" name="attendingPlayers" min="0">
                </div>
                <div class="col-md-4">
                    <label>⚠️ Questionable Players</label>
                    <input type="number" class="form-control" [(ngModel)]="trainingSession.questionablePlayers" name="questionablePlayers" min="0">
                </div>
                <div class="col-md-4">
                    <label>❌ Absent Players</label>
                    <input type="number" class="form-control" [(ngModel)]="trainingSession.absentPlayers" name="absentPlayers" min="0">
                </div>
            </div>

            <!-- 📝 Session Notes -->
            <div class="form-group mt-3">
                <label>Before Session Notes</label>
                <textarea class="form-control" rows="3" [(ngModel)]="trainingSession.beforeSessionNotes" name="beforeSessionNotes"></textarea>
            </div>

            <div class="form-group mt-3">
                <label>After Session Notes</label>
                <textarea class="form-control" rows="3" [(ngModel)]="trainingSession.afterSessionNotes" name="afterSessionNotes"></textarea>
            </div>

            <!-- ✅ Submit Button -->
            <button type="submit" class="btn btn-primary mt-3">💾 Save Session</button>
        </form>
    </div>
</div>

<br><br><br><br>

<app-footer></app-footer>
