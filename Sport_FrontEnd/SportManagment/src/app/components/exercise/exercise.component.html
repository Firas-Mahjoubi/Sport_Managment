<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="form-container">
      <div class="card shadow-lg p-4">
        <h2 class="text-center text-primary mb-4">🏋️ Add a New Exercise</h2>
  
        <div class="row">
          <!-- ✅ Exercise Name -->
          <div class="col-md-6">
            <label class="fw-bold">Exercise Name *</label>
            <input type="text" class="form-control" [(ngModel)]="newExercise.name" required>
          </div>
  
          <!-- ✅ Visibility -->
          <div class="col-md-6">
            <label class="fw-bold">Visibility</label>
            <select class="form-control" [(ngModel)]="newExercise.visibility">
              <option value="PUBLIC">Public</option>
              <option value="PRIVATE">Private</option>
            </select>
          </div>
        </div>
  
        <!-- ✅ Description -->
        <div class="form-group mt-3">
          <label class="fw-bold">Description</label>
          <textarea class="form-control" rows="4" [(ngModel)]="newExercise.description"></textarea>
        </div>
  
        <!-- ✅ Skill Levels -->
        <div class="row mt-3">
          <div class="col-md-4">
            <label class="fw-bold">💪 Fitness</label>
            <input type="range" min="0" max="10" [(ngModel)]="newExercise.fitnessLevel" class="form-range">
          </div>
          <div class="col-md-4">
            <label class="fw-bold">⚽ Technique</label>
            <input type="range" min="0" max="10" [(ngModel)]="newExercise.techniqueLevel" class="form-range">
          </div>
          <div class="col-md-4">
            <label class="fw-bold">🎯 Tactics</label>
            <input type="range" min="0" max="10" [(ngModel)]="newExercise.tacticLevel" class="form-range">
          </div>
        </div>
  
        <!-- ✅ Main Focus -->
        <div class="form-group mt-3">
          <label class="fw-bold">🏆 Main Focus</label>
          <input type="text" class="form-control" [(ngModel)]="newExercise.mainFocus">
        </div>
  
        <!-- ✅ Age Group -->
        <div class="row mt-3">
          <div class="col-md-6">
            <label class="fw-bold">🧒 Age Group</label>
            <select class="form-control" [(ngModel)]="newExercise.ageGroup">
              <option value="">Select Age</option>
              <option value="U10">U10</option>
              <option value="U12">U12</option>
              <option value="U14">U14</option>
              <option value="U16">U16</option>
            </select>
          </div>
  
          <div class="col-md-6">
            <label class="fw-bold">👥 Group Size</label>
            <input type="number" class="form-control" [(ngModel)]="newExercise.groupSize">
          </div>
        </div>
  
        <!-- ✅ Duration & Image -->
        <div class="row mt-3">
          <div class="col-md-6">
            <label class="fw-bold">⏳ Duration (minutes)</label>
            <input type="number" class="form-control" [(ngModel)]="newExercise.durationMinutes">
          </div>
          <div class="col-md-6">
            <label class="fw-bold">🖼️ Image URL</label>
            <input type="text" class="form-control" [(ngModel)]="newExercise.imageUrl">
          </div>
        </div>
  
        <!-- ✅ Tags -->
        <div class="form-group mt-3">
          <label class="fw-bold">🏷️ Tags</label>
          <div class="d-flex flex-wrap">
            <div *ngFor="let tag of tags" class="form-check me-3">
              <input class="form-check-input" type="checkbox" [value]="tag.id" [(ngModel)]="selectedTags">
              <label class="form-check-label">{{ tag.name }}</label>
            </div>
          </div>
        </div>
  
        <!-- ✅ Submit Button -->
        <div class="text-center mt-4">
          <button class="btn btn-lg btn-primary" (click)="addExercise()">✅ Add Exercise</button>
        </div>
      </div>
    </div>
  </div>
