<div class="container mt-4">
  <h2 class="text-center mb-4">Liste des Équipes</h2>

  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>Nom</th>
        <th>Stadium</th>
        <th>Logo</th>
        <th>Catégorie</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams">
        <td>{{ team.name }}</td> <!-- ✅ Affiche le nom au lieu de l'ID -->
        <td>{{ team.stadium }}</td>
        <td>
          <img [src]="team.logoUrl" alt="Logo" class="img-thumbnail" width="50" height="50"> 
        </td>
        <td>{{ team.category }}</td>
        <td class="text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary btn-sm" [routerLink]="['/edit-team', team.id]">
              <i class="bi bi-pencil"></i> Modifier
            </button>
            <button class="btn btn-danger btn-sm" *ngIf="team.id !== undefined" (click)="deleteTeam(team.id!)">
              <i class="bi bi-trash"></i> Supprimer
            </button>
            
          </div>
        </td>
        
      </tr>
    </tbody>
  </table>
</div>
