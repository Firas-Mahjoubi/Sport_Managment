<h2 class="text-center my-4">Clubs</h2>

<div class="container">
  <table class="table table-striped table-bordered">
    <thead class="table-dark text-center">
      <tr>
        <th>Name</th>
        <th>Logo</th>
        <th>Location</th>
        <th>Year of Foundation</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let club of clubs" class="align-middle">
        <td>{{ club.name }}</td>

        <!-- ✅ Affichage du logo avec une image -->
        <td class="text-center">
          <img [src]="club.clubLogo" alt="Logo de {{ club.name }}" class="img-thumbnail" width="80" height="80">
        </td>

        <td>{{ club.location }}</td>
        <td>{{ club.foundationYear }}</td>
        <td class="text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary btn-sm" [routerLink]="['/edit-club', club.id]">
              <i class="bi bi-pencil"></i> To modify
            </button>
            <button class="btn btn-danger btn-sm" (click)="deleteClub(club.id!)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
