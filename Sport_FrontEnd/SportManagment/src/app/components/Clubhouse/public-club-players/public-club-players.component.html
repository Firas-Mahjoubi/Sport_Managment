<app-header></app-header>
<br>
<br>

<div class="container mt-5 py-5">
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="text-center fw-bold text-uppercase">Nos Joueurs</h2>
      <div class="text-center mb-4">
        <div class="divider-custom"></div>
      </div>
    </div>
  </div>
  
  <div class="players-grid">
    <div class="grid-item" *ngFor="let player of players; let i = index" [ngStyle]="{'animation-delay': i * 0.1 + 's'}">
      <div class="card-player">
        <div class="card-inner">
          <!-- Image du joueur -->
          <div class="player-media">
            <img 
              [src]="'http://localhost:8088/players/image/' + player.id"
              alt="{{ player.firstName }} {{ player.lastName }}"
              class="player-image"
              (error)="player.imageUrl = 'assets/default-player.png'">
          </div>

          <!-- Corps de la carte -->
          <div class="card-body">
            <!-- Badge numéro -->
            <div class="player-number">#{{ player.playerNumber }}</div>

            <!-- Nom -->
            <h5 class="player-name">
              {{ player.firstName }} {{ player.lastName }}
            </h5>

            <!-- Poste -->
            <div class="player-position">
              {{ player.position }}
            </div>

            <!-- Bouton QR Code -->
            <button class="qr-button" [routerLink]="['/public-player-qr', player.id]">
              <span>View QR Code</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
