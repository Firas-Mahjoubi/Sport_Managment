<app-admin-sidebar></app-admin-sidebar>
<app-admin-header></app-admin-header>
<div class="content-wrapper">

  <div class="players-container container mt-5">
  <h2 class="section-title text-center mb-5 position-relative">🌟 Our Star Players</h2>

  <!-- 🔥 BOUTONS DE TRI -->
  <div class="d-flex justify-content-center flex-wrap mb-4 gap-3">
    
    <button class="btn btn-outline-primary" (click)="sortPlayers('birthDate')">
      Trier par Date de Naissance
    </button>
    <button class="btn btn-outline-primary" (click)="sortPlayers('playerNumber')">
      Trier par Numéro
    </button>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-xl-4" *ngFor="let player of players">
      <div class="card player-card shadow-lg border-0 overflow-hidden h-100 hover-effect">
        <div class="card-header position-relative p-0 border-0">
          <div class="image-wrapper position-relative">
            <img
              [src]="player.imageUrl || 'assets/default-avatar.png'"
              alt="Player Avatar"
              class="rounded-circle mx-auto mt-4 player-avatar"
              (error)="player.imageUrl = 'assets/default-avatar.png'"
            />
            <div class="gradient-overlay"></div>
          </div>
        </div>

        <div class="card-body pt-4 pb-3 px-4 text-center">
          <h3 class="player-name mb-3 fw-bold text-gradient">
            {{ player.firstName }} 
            <span class="d-block">{{ player.lastName }}</span>
          </h3>
          
          <div class="player-info mb-4">
            <div class="d-flex align-items-center justify-content-center mb-2">
              <i class="fas fa-map-marker-alt me-2 text-primary"></i>
              <span class="badge bg-primary-soft text-primary rounded-pill px-3">{{ player.position }}</span>
            </div>
            
            <div class="d-flex justify-content-between info-item">
              <span class="text-start">
                <i class="fas fa-birthday-cake me-2 text-muted"></i>
                {{ player.birthDate | date: 'dd/MM/yyyy' }}
              </span>
              <span class="text-end">
                <i class="fas fa-tag me-2 text-muted"></i>
                #{{ player.playerNumber }}
              </span>
            </div>

            <div class="status-indicator mt-3" [ngClass]="{'active': player.status, 'inactive': !player.status}">
              <i class="fas fa-circle me-2"></i>
              {{ player.status || 'Inactive' }}
            </div>
          </div>
        </div>

        <div class="card-footer bg-transparent border-0 pb-4 px-4">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-action btn-edit" (click)="editPlayer(player)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-action btn-view" (click)="viewDetails(player.id)">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-action btn-delete" (click)="deletePlayer(player.id)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
