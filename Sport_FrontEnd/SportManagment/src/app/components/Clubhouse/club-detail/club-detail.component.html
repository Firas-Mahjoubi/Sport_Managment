<div class="container mt-5" *ngIf="club">
    <div class="card shadow p-4 text-center">
      <img [src]="club.imageUrl" class="img-fluid rounded mx-auto d-block" 
           style="width: 120px; height: 120px; object-fit: cover;" alt="Club Logo" />
  
      <h2 class="mt-3 text-primary">{{ club.name }}</h2>
      <p><strong>📍 Location:</strong> {{ club.location }}</p>
      <p>🏆 <strong>League:</strong> {{ club?.league?.name || 'Not assigned' }}</p>

      <p><strong>🏟️ Stadium:</strong> {{ club.stadiumName }}</p>
      <p><strong>📅 Founded:</strong> {{ club.foundationYear }}</p>
  
      <a routerLink="/clubs" class="btn btn-outline-secondary mt-3">⬅ Back to Clubs</a>
      <a [routerLink]="['/players-by-club', club.id]" class="btn btn-outline-info mt-3">
        👥 Voir les joueurs du club
      </a>
      
    </div>
  </div>
