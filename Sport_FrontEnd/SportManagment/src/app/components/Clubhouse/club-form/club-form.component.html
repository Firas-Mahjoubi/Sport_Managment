<app-admin-sidebar></app-admin-sidebar>
<div class="container">
  <h2 class="text-center form-title">Add Club</h2>

  <div class="card p-4 shadow">
    <form [formGroup]="clubForm" (ngSubmit)="saveClub()">


      <!-- 🟦 NOM -->
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="name">Name*</label>
            <input type="text" id="name" class="form-control" formControlName="name" />
            <small class="text-danger" *ngIf="clubForm.get('name')?.invalid && clubForm.get('name')?.touched">
              Name is required (min. 3 characters).
            </small>
          </div>
        </div>

        <!-- 🟦 LOCATION -->
        <div class="col-md-6">
          <div class="form-group">
            <label for="location">Location*</label>
            <input type="text" id="location" class="form-control" formControlName="location" />
          </div>
        </div>
      </div>

      <!-- 🟦 STADIUM & FOUNDATION YEAR -->
      <div class="row mt-3">
        <div class="col-md-6">
          <div class="form-group">
            <label for="stadium">Stadium*</label>
            <input type="text" id="stadium" class="form-control" formControlName="stadiumName" />
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label for="foundationYear">Year of Foundation*</label>
            <input type="date" id="foundationYear" class="form-control" formControlName="foundationYear" />
          </div>
        </div>
      </div>

      <div class="form-group mt-3">
        <label for="leagueId">League</label>
        <select id="leagueId" class="form-control" formControlName="leagueId" required>
          <option value="">-- Select a league --</option>
          <option *ngFor="let league of leagues" [value]="league.id">
            {{ league.name }}
          </option>
        </select>
      </div>
      
    


      <!-- 🟦 UPLOAD LOGO -->
      <div class="form-group mt-3">
        <label for="clubLogo">Upload Logo</label>
        <input type="file" id="clubLogo" class="form-control" (change)="onFileSelected($event)" />
      </div>

      <!-- ✅ PREVIEW (OPTIONNEL) -->
      <div *ngIf="selectedImageFile" class="text-center mt-3">
        <p>Preview:</p>
        <img [src]="imagePreview" class="img-thumbnail" style="max-height: 100px;" />
      </div>

      <!-- 🟦 BUTTON -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="clubForm.invalid">
          <i class="bi bi-plus-circle"></i> Add Club
        </button>
      </div>

    </form>
  </div>
</div>
