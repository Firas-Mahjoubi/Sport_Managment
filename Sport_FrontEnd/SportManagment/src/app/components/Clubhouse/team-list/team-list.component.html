<app-admin-sidebar></app-admin-sidebar>
<app-admin-header></app-admin-header>
<div class="content-wrapper">
  <div class="container-fluid px-5 my-5">
  <!-- En-tête avec effet de gradient -->
  <div class="text-center mb-5">
    <h2 class="display-5 fw-bold gradient-text">
      <i class="bi bi-people-fill me-3"></i>Our Dream Team
    </h2>
    <p class="lead text-muted">Meet the brilliant minds behind our success</p>
  </div>

  <!-- Grille d'équipes améliorée -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    <div class="col" *ngFor="let team of teams">
      <div class="card card-team h-100 border-0 shadow-lg rounded-4 overflow-hidden transition-all">
        <!-- Bannière colorée dynamique -->
        <div class="card-header bg-gradient-primary py-4 position-relative">
          <div class="blur-effect"></div>
          <h3 class="text-dark mb-0 text-truncate">
            <i class="bi bi-shield-shaded me-2"></i>{{ team.name }}
          </h3>
        </div>

        <!-- Corps de carte enrichi -->
        <div class="card-body pb-0">
          <div class="d-flex align-items-center mb-3">
            <div class="icon-wrapper bg-primary-soft">
              <i class="bi bi-tags text-primary fs-4"></i>
            </div>
            <div class="ms-3">
              <h6 class="mb-0 text-uppercase text-muted small">Specialization</h6>
              <p class="mb-0 fw-bold text-dark">{{ team.categories }}</p>
            </div>
          </div>

          

        <!-- Pied de carte stylisé -->
        <div class="card-footer bg-transparent border-0 pt-0">
          <div class="d-grid gap-2 d-flex justify-content-center">
            <button 
              class="btn btn-primary btn-hover-icon px-4 py-2" 
              [routerLink]="['/edit-team', team.id]">
              <i class="bi bi-pencil me-2"></i>Edit Team
            </button>
            <button 
              class="btn btn-danger btn-hover-icon px-4 py-2" 
              *ngIf="team.id !== undefined" 
              (click)="deleteTeam(team.id!)">
              <i class="bi bi-trash3 me-2"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
