<app-header></app-header>
<br>
<br>
<br>

<div class="container mt-5">
  
  
  <div class="clubs-container">
    <!-- Input de recherche -->
    <div class="search-bar-container text-center mb-4">
      <input
        type="text"
        class="form-control search-input"
        [(ngModel)]="searchKeyword"
        (input)="searchClubs()"
        placeholder="Search by club name or location..." />
    </div>
  
    <!-- Bouton Export -->
    <div class="text-center mb-5">
      <button class="btn btn-success" (click)="exportClubsCsv()">
        <i class="fas fa-file-download"></i> Export Club to CSV
      </button>
    </div>

    <!-- Liste des clubs -->
    <div *ngIf="clubs.length > 0; else noClubsFound">
      <div class="row g-4">
        <div *ngFor="let club of clubs" class="col-md-4">
          <div class="club-card shadow rounded">
            <div class="club-header">
              <div class="text-center">
                <img 
                  [src]="club.imageUrl" 
                  alt="Club Logo" 
                  class="club-logo"
                  onerror="this.src='assets/default-club.png'">
              </div>
            </div>
  
            <div class="club-body text-center">
              <h3 class="club-name">{{club.name}}</h3>
              
              <div class="club-actions">
                <button class="btn btn-primary" (click)="viewPlayers(club.id)">
                  <i class="fas fa-users"></i> View Players
                </button>
                
                <button class="btn btn-outline-primary mt-2" (click)="exportClubPdf(club.id)">
                  <i class="fas fa-file-pdf"></i> Export PDF
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Template si aucun club trouvé -->
    <ng-template #noClubsFound>
      <div class="text-center mt-5">
        <i class="fas fa-search fa-4x text-muted"></i>
        <h4 class="mt-3 text-muted">No matching clubs found</h4>
        <p class="text-secondary">Try adjusting your search criteria or check the spelling</p>
        <button class="btn btn-primary mt-3" (click)="searchKeyword = ''; searchClubs()">
          <i class="fas fa-redo"></i> Reset Search
        </button>
      </div>
    </ng-template>
  </div>
</div>

<app-footer></app-footer>
