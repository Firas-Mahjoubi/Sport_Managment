

<!-- Goal Form -->
<form [formGroup]="goalForm">
  <input type="number" formControlName="scorerNumber" placeholder="Scorer Number" required>
  <input type="number" formControlName="assisterNumber" placeholder="Assister Number">
  <input type="number" formControlName="timing" placeholder="Timing" required>

  <!-- Home or Away Team Selection -->
  <label>
    <input type="radio" formControlName="isHomeGoal" [value]="true"> Home Goal
  </label>
  <label>
    <input type="radio" formControlName="isHomeGoal" [value]="false"> Away Goal
  </label>

  <button type="button" (click)="addGoal()">Add Goal</button>
</form>

<!-- Goals List -->
<ul>
  <li *ngFor="let goal of goals">
    <strong>{{ goal.scorerFirstName }} {{ goal.scorerLastName || '' }}</strong>
    <span *ngIf="goal.assisterFirstName"> assisted by {{ goal.assisterFirstName }} {{ goal.assisterLastName || '' }}</span>
    at {{ goal.timing }}' ({{ goal.homeGoal ? 'Home' : 'Away' }})
    - <strong>Result:</strong> {{ goal.result }}

    <button (click)="deleteGoal(goal.id)">Delete</button>
  </li>
</ul>
