<div class="gameweek-slider">
  <button (click)="prevGameWeek()" [disabled]="startIndex === 0" class="nav-btn">‹</button>

  <div class="gameweek-container">
    <div
      *ngFor="let gw of gameWeeks.slice(startIndex, startIndex + 3)"
      (click)="selectGameWeek(gw)"
      [class.selected]="gw === selectedGameWeek"
      class="gameweek-item"
    >
      GW{{ gw }}
    </div>
  </div>

  <button (click)="nextGameWeek()" [disabled]="startIndex + 3 >= gameWeeks.length" class="nav-btn">›</button>
</div>
