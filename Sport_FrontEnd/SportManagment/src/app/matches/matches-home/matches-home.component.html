<div class="navbar">
<app-matches-navbar></app-matches-navbar>
</div>

<!-- Gameweek Slider Container -->
<div class="gameweek-container">
  <app-gameweek-slider (gameWeekSelected)="onGameWeekSelected($event)"></app-gameweek-slider>
</div>
<!-- Matches Container -->
<div *ngFor="let league of leagues" class="matches-container">
  <div class="league-header">
    <img [src]="league.logourl" alt="{{ league.name }}" class="league-logo">
    <div class="league-info">
      <h3 class="league-title">{{ league.name }}</h3>
      <p class="league-nation">{{ league.nation }}</p>
    </div>
  </div>

  <div *ngFor="let match of matchesByLeague[league.name]" class="match-card" (click)="goToMatchDetails(match.id)">
    <div class="match-info">
      <div class="team">
        <img [src]="match.homeTeamLogo" alt="{{ match.homeTeam }}" class="team-logo">
        <span class="team-name">{{ match.homeTeam }}</span>
      </div>

      <span class="match-result">{{ match.result !== null ? match.result : '-' }}</span>

      <div class="team">
        <span class="team-name">{{ match.awayTeam }}</span>
        <img [src]="match.awayTeamLogo" alt="{{ match.awayTeam }}" class="team-logo">
      </div>
    </div>
  </div>
</div>
