<div class="container">
  <h2 class="text-center my-4">Manage Cards</h2>

  <!-- Success & Error Messages -->
  <div *ngIf="successMessage" class="alert alert-success text-center">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <!-- Add Card Form -->
  <div class="card p-4 shadow-sm">
    <div class="row mb-3">
      <div class="col-md-3">
        <label class="form-label">Player Number:</label>
        <input type="number" class="form-control" [(ngModel)]="playerNumber" placeholder="Enter player number" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Card Type:</label>
        <select class="form-control" [(ngModel)]="cardType">
          <option value="YELLOW">Yellow Card</option>
          <option value="RED">Red Card</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Team:</label>
        <select class="form-control" [(ngModel)]="isHomeTeam">
          <option [value]="true">Home Team</option>
          <option [value]="false">Away Team</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Card Time (Min):</label>
        <input type="number" class="form-control" [(ngModel)]="cardTime" placeholder="Minute of card" />
      </div>
    </div>

    <button class="btn btn-primary w-100" (click)="addCard()" [disabled]="loading">
      {{ loading ? 'Adding...' : 'Add Card' }}
    </button>
  </div>

  <!-- Loading Indicator -->
  <div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Card List -->
  <div *ngIf="cards.length > 0" class="mt-4">
    <h3 class="text-center">Cards for Match</h3>
    <ul class="list-group">
      <li *ngFor="let card of cards" class="list-group-item d-flex justify-content-between align-items-center">
        <span>
          <strong>{{ card.cardType }}</strong> - Player {{ card.numberOfPlayer }} ({{ card.forHomeTeam ? 'Home' : 'Away' }})
          <span class="badge bg-secondary ms-2">Min {{ card.cardTime }}</span>
        </span>
        <button (click)="deleteCard(card.cardId)" class="btn btn-danger">Delete</button>
      </li>
    </ul>
  </div>

  <!-- No Cards Found Message -->
  <div *ngIf="cards.length === 0 && !loading" class="alert alert-warning text-center mt-4">
    No cards found for this match.
  </div>
</div>
