<!-- 🌌 Arrière-plan avec une image en HTML -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/injury1.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="container mt-4">
  <h2 class="text-center">📜 Blessures Archivées</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Joueur</th>
        <th>Type</th>
        <th>Gravité</th>
        <th>Description</th>
        <th>Status</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let injury of archivedInjuries">
        <td>{{ injury.date | date:'dd/MM/yyyy' }}</td>

        <!-- ✅ Vérification du joueur -->
        <td *ngIf="injury.player; else noPlayer">
          {{ injury.player.firstName }} {{ injury.player.lastName }}
        </td>
        <ng-template #noPlayer>
          <td>Aucun joueur</td>
        </ng-template>

        <td>{{ injury.type }}</td>
        <td>{{ injury.severity }}</td>
        <td>{{ injury.description }}</td>
        <td>{{ injury.status }}</td>



      </tr>
    </tbody>
  </table>
</div>
<!-- 🔙 Bouton Retour -->
<a [routerLink]="['/health/injury']" class="btn-back">
  ⬅️ Retour à la Liste des Blessures
</a>
