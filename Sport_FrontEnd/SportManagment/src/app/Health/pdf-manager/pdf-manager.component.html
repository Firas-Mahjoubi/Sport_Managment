<!-- 🌌 Background with an image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/health.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="pdf-manager-container">
  <h2 class="title">⚽ Player List</h2>
  <input
  type="text"
  class="form-control mb-3"
  placeholder="🔍 Search by last name"
  [(ngModel)]="searchTerm"
  (input)="filterPlayers()"
  />

  <table class="table table-striped table-hover player-table">
    <thead>
      <tr>
        <th>👤 Last Name</th>
        <th>🏆 First Name</th>
        <th>📌 Position</th>
        <th>🎽 Number</th>
        <th>📄 Manage PDF</th> <!-- New column for generating the PDF -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let player of visiblePlayers()">
        <td>{{ player.lastName }}</td>
        <td>{{ player.firstName }}</td>
        <td>{{ player.position }}</td>
        <td>{{ player.playerNumber }}</td>
        <td>
          <button (click)="generatePdf(player)" class="btn btn-generate-pdf">📄 Generate PDF</button> <!-- Button to generate PDF -->
        </td>
      </tr>
    </tbody>
  </table>

  <!-- 🔮 Futuristic Pagination -->
  <div *ngIf="totalPages > 1" class="futuristic-pagination mt-4">
    <button
      class="page-button prev"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)">
      «
    </button>

    <div class="page-indicators">
      <!-- Always show the first page -->
      <span
        class="page-circle"
        [class.active]="currentPage === 1"
        (click)="changePage(1)">
        1
      </span>

      <!-- Show ... if currentPage > 4 -->
      <span *ngIf="currentPage > 4" class="dots">...</span>

      <!-- Dynamic middle pages -->
      <span
        *ngFor="let page of visiblePagesNumbers()"
        class="page-circle"
        [class.active]="currentPage === page"
        (click)="changePage(page)">
        {{ page }}
      </span>

      <!-- Show ... if currentPage < totalPages - 3 -->
      <span *ngIf="currentPage < totalPages - 3" class="dots">...</span>

      <!-- Always show the last page -->
      <span
        class="page-circle"
        [class.active]="currentPage === totalPages"
        (click)="changePage(totalPages)">
        {{ totalPages }}
      </span>
    </div>

    <button
      class="page-button next"
      [disabled]="currentPage === totalPages"
      (click)="changePage(currentPage + 1)">
      »
    </button>

  </div>

  <!-- 🔘 Bottom Buttons -->
  <div class="bottom-buttons">
    <!-- 🔙 Back to Health Dashboard button -->
    <a [routerLink]="['/health-dashboard']" class="btn-back-health">
      ⬅️ Back to Health Dashboard
    </a>
  </div>

</div>
