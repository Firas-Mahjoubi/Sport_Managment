<!-- 🌌 Arrière-plan avec une image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/health.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="pdf-manager-container">
  <h2 class="title">⚽ Liste des Joueurs</h2>

  <table class="table table-striped table-hover player-table">
    <thead>
      <tr>
        <th>👤 Nom</th>
        <th>🏆 Prénom</th>
        <th>📌 Position</th>
        <th>🎽 Numéro</th>
        <th>📄 Gérer PDF</th> <!-- Nouvelle colonne pour générer le PDF -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let player of players">

        <td>{{ player.lastName }}</td>
        <td>{{ player.firstName }}</td>
        <td>{{ player.position }}</td>
        <td>{{ player.playerNumber }}</td>
        <td>
          <button (click)="generatePdf(player)" class="btn btn-generate-pdf">📄 Générer PDF</button> <!-- Bouton pour générer le PDF -->
        </td>

      </tr>
    </tbody>
  </table>
</div>



<!-- 🔘 Boutons en bas -->
<div class="bottom-buttons">
  <!-- 🔙 Bouton Retour au Tableau de Santé -->
  <a [routerLink]="['/health-dashboard']" class="btn-back-health">
    ⬅️ Retour au Tableau de Santé
  </a>
