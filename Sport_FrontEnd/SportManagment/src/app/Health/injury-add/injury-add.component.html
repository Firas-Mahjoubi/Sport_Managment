<!-- 🌌 Arrière-plan avec une image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/injury1.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<!-- 📦 Formulaire d'ajout -->
<div class="injury-add-container">
  <h2 class="form-title">➕ Ajouter une Blessure</h2>

  <form [formGroup]="injuryForm" (ngSubmit)="submitForm()" class="injury-form">
    <div class="form-row">
      <!-- Joueur -->
      <div class="form-group">
        <label for="player">👤 Joueur :</label>
        <select id="player" formControlName="player" class="form-control">
          <option *ngFor="let player of players" [value]="player.id + ''">
            {{ player.firstName }} {{ player.lastName }} (#{{ player.playerNumber }})
          </option>
        </select>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label for="date">📅 Date de la blessure :</label>
        <input type="date" id="date" formControlName="date" class="form-control">
      </div>
    </div>

    <div class="form-row">
      <!-- Type de blessure -->
      <div class="form-group">
        <label for="type">⚠️ Type :</label>
        <select id="type" formControlName="type" class="form-control">
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- Gravité -->
      <div class="form-group">
        <label for="severity">🔥 Gravité :</label>
        <select id="severity" formControlName="severity" class="form-control">
          <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Zone affectée -->
      <div class="form-group">
        <label for="zoneAffectee">📍 Zone affectée :</label>
        <select id="zoneAffectee" formControlName="zoneAffectee" class="form-control">
          <option *ngFor="let z of zones" [value]="z">{{ z }}</option>
        </select>
      </div>

      <!-- Statut -->
      <div class="form-group">
        <label for="status">🚦 Statut :</label>
        <select id="status" formControlName="status" class="form-control">
          <option *ngFor="let st of statuses" [value]="st">{{ st }}</option>
        </select>
      </div>
    </div>

    <!-- Description (pleine largeur) -->
    <div class="form-group">
      <label for="description">📝 Description :</label>
      <textarea id="description" formControlName="description" rows="3" class="form-control"></textarea>
    </div>

    <!-- Cause -->
    <div class="form-group">
      <label for="cause">💥 Cause :</label>
      <input type="text" id="cause" formControlName="cause" class="form-control">
    </div>

    <!-- Boutons -->
    <div class="form-buttons">
      <button type="submit" [disabled]="injuryForm.invalid" class="submit-btn">
        ✅ Ajouter la Blessure
      </button>
      <a [routerLink]="['/health/injury']" class="cancel-btn">❌ Annuler</a>
    </div>
  </form>
</div> /* 🌟 Conteneur principal */
