<p>injury-add works!</p>
<div class="container mt-4">
  <h2 class="text-center">Ajouter une Blessure</h2>

  <form [formGroup]="injuryForm" (ngSubmit)="submitForm()" class="mt-4">
    <!-- Sélection du joueur -->
    <div class="mb-3">
      <label for="player" class="form-label">Joueur :</label>
      <select id="player" class="form-select" formControlName="player">
        <option *ngFor="let player of players" [value]="player.id + ''">

          {{ player.firstName }} {{ player.lastName }} (#{{ player.playerNumber }})
        </option>
      </select>
    </div>

    <!-- Date -->
    <div class="mb-3">
      <label for="date" class="form-label">Date de la blessure :</label>
      <input type="date" id="date" class="form-control" formControlName="date" required>
    </div>

    <!-- Type de blessure -->
    <div class="mb-3">
      <label for="type" class="form-label">Type :</label>
      <select id="type" class="form-select" formControlName="type">
        <option *ngFor="let t of types" [value]="t">{{ t }}</option>
      </select>
    </div>

    <!-- Gravité -->
    <div class="mb-3">
      <label for="severity" class="form-label">Gravité :</label>
      <select id="severity" class="form-select" formControlName="severity">
        <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
      </select>
    </div>

    <!-- Zone affectée -->
    <div class="mb-3">
      <label for="zoneAffectee" class="form-label">Zone affectée :</label>
      <select id="zoneAffectee" class="form-select" formControlName="zoneAffectee">
        <option *ngFor="let z of zones" [value]="z">{{ z }}</option>
      </select>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label for="description" class="form-label">Description :</label>
      <textarea id="description" class="form-control" formControlName="description" rows="3"></textarea>
    </div>

    <!-- Cause -->
    <div class="mb-3">
      <label for="cause" class="form-label">Cause :</label>
      <input type="text" id="cause" class="form-control" formControlName="cause">
    </div>

    <!-- Statut -->
    <div class="mb-3">
      <label for="status" class="form-label">Statut :</label>
      <select id="status" class="form-select" formControlName="status">
        <option *ngFor="let st of statuses" [value]="st">{{ st }}</option>
      </select>
    </div>

    <!-- Bouton Ajouter -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="injuryForm.invalid">
      Ajouter Blessure
    </button>
  </form>
</div>
