<div class="container mt-4">
  <h2 class="text-center">🏥 Liste des Blessures</h2>

  <!-- 🔍 Filtrage des blessures -->
  <div class="row mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        [(ngModel)]="searchText"
        (input)="filterInjuries()"
        placeholder="🔍 Rechercher par type ou description">
    </div>

    <div class="col-md-4">
      <select
        class="form-select"
        [(ngModel)]="selectedPlayer"
        (change)="filterInjuries()">
        <option value="all">👥 Tous les joueurs</option>
        <option *ngFor="let player of players" [value]="player.id">
          {{ player.firstName }} {{ player.lastName }}
        </option>
      </select>
    </div>
  </div>

  <!-- 🏥 Tableau des blessures -->
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>👤 Joueur</th>
        <th>🩹 Type</th>
        <th>⚠️ Gravité</th>
        <th>🔄 Status</th>
        <th>⚙️ Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let injury of filteredInjuries">
        <!-- ✅ Vérification du joueur -->
        <td *ngIf="injury.player; else noPlayer">
          {{ injury.player.firstName }} {{ injury.player.lastName }}
        </td>
        <ng-template #noPlayer>
          <td class="text-muted">Aucun joueur</td>
        </ng-template>

        <td>{{ injury.type }}</td>
        <td>{{ injury.severity }}</td>
        <td>{{ injury.status }}</td>
        <td>
          <!-- Bouton Voir -->
          <a [routerLink]="['/health/injury/show', injury.id]" class="btn btn-info btn-sm">
            🔍 Voir
          </a>

          <!-- Bouton Modifier -->
          <a [routerLink]="['/health/injury/edit', injury.id]" class="btn btn-warning btn-sm">
            ✏️ Modifier
          </a>

          <!-- Bouton Supprimer (Désactivé si l'injury n'est pas GUERIE) -->
          <button
            (click)="deleteInjury(injury)"
            class="btn btn-danger btn-sm"
            [disabled]="injury.status !== 'GUERIE'">
            🗑️ Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
