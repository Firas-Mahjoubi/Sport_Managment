

<a [routerLink]="['/health/injury/add']" class="btn-add-health">
  ➕ Ajouter Blessures
</a>


<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/injury1.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="container injury-container mt-4">
  <h2 class="title">🏥 Liste des Blessures</h2>

  <!-- 🔍 Filtrage des blessures -->
  <div class="row mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control search-input"
        [(ngModel)]="searchText"
        (input)="filterInjuries()"
        placeholder="🔍 Rechercher par type ou description">
    </div>

    <div class="col-md-4">
      <select
        class="form-select player-select"
        [(ngModel)]="selectedPlayer"
        (change)="filterInjuries()">
        <option value="all">👥 Tous les joueurs</option>
        <option *ngFor="let player of players" [value]="player.id">
          {{ player.firstName }} {{ player.lastName }}
        </option>

      </select>

    </div>
  </div>

  <!-- 🏥 Tableau des blessures -->
  <table class="table table-striped table-hover injury-table">
    <thead>
      <tr>
        <th>👤 Joueur</th>
        <th>🩹 Type</th>
        <th>⚠️ Gravité</th>
        <th>🔄 Status</th>
        <th>⚙️ Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let injury of filteredInjuries">
        <td *ngIf="injury.player; else noPlayer">
          {{ injury.player.firstName }} {{ injury.player.lastName }}
        </td>
        <ng-template #noPlayer>
          <td class="text-muted">Aucun joueur</td>
        </ng-template>

        <td>{{ injury.type }}</td>
        <td>{{ injury.severity }}</td>
        <td>{{ injury.status }}</td>
        <td>
          <a [routerLink]="['/health/injury/show', injury.id]" class="btn btn-view btn-sm">
            🔍 Voir
          </a>

          <a [routerLink]="['/health/injury/edit', injury.id]" class="btn btn-edit btn-sm">
            ✏️ Modifier
          </a>
          <button
            (click)="deleteInjury(injury)"
            class="btn btn-delete btn-sm"
            [disabled]="injury.status !== 'GUERIE'">
            🗑️ Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>



<a [routerLink]="['/health-dashboard']" class="btn-back-health">
  ⬅️ Retour au Tableau de Santé
</a>
