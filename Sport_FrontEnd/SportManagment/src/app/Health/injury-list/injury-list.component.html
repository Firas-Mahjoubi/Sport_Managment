<a [routerLink]="['/health/injury/add']" class="btn-add-health">
  ➕ Add Injury
</a>

<!-- 🔲 Arrière-plan sombre -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/injury1.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="container injury-container mt-4">
  <h2 class="title">🏥 Injury List</h2>

  <!-- 🔍 Filtrage -->
  <div class="row mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control search-input"
        [(ngModel)]="searchPlayer"
        (input)="filterInjuries()"
        placeholder="🔍 Search by player's first or last name">
    </div>

    <div class="col-md-4">
      <select
        class="form-select player-select"
        [(ngModel)]="selectedPlayer"
        (change)="filterInjuries()">
        <option value="all">👥 All Players</option>
        <option *ngFor="let player of players" [value]="player.id">
          {{ player.firstName }} {{ player.lastName }}
        </option>
      </select>
    </div>
  </div>

  <!-- 🏥 Tableau -->
  <table class="table table-striped table-hover injury-table">
    <thead>
      <tr>
        <th>👤 Player</th>
        <th>🩹 Type</th>
        <th>⚠️ Severity</th>
        <th>🔄 Status</th>
        <th>⚙️ Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let injury of paginatedInjuries">

        <td *ngIf="injury.player; else noPlayer">
          {{ injury.player.firstName }} {{ injury.player.lastName }}
        </td>
        <ng-template #noPlayer>
          <td class="text-muted">No Player</td>
        </ng-template>

        <td>{{ injury.type }}</td>
        <td>{{ injury.severity }}</td>
        <td>{{ injury.status }}</td>
        <td>
          <a [routerLink]="['/health/injury/show', injury.id]" class="btn btn-view btn-sm">
            🔍 View
          </a>
          <a [routerLink]="['/health/injury/edit', injury.id]" class="btn btn-edit btn-sm">
            ✏️ Edit
          </a>
          <button
            (click)="deleteInjury(injury)"
            class="btn btn-delete btn-sm"
            [disabled]="injury.status !== 'GUERIE'">
            🗑️ Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- 🔮 Pagination Futuriste Avancée -->
  <div *ngIf="totalPages > 1" class="futuristic-pagination mt-4">
    <button
      class="page-button prev"
      [disabled]="currentPage === 1"
      (click)="changePage(currentPage - 1)">
      «
    </button>

    <div class="page-indicators">
      <!-- Always show first page -->
      <span
        class="page-circle"
        [class.active]="currentPage === 1"
        (click)="changePage(1)">
        1
      </span>

      <!-- Show ... if currentPage > 4 -->
      <span *ngIf="currentPage > 4" class="dots">...</span>

      <!-- Dynamic middle pages -->
      <span
        *ngFor="let page of visiblePages()"
        class="page-circle"
        [class.active]="currentPage === page"
        (click)="changePage(page)">
        {{ page }}
      </span>

      <!-- Show ... if currentPage < totalPages - 3 -->
      <span *ngIf="currentPage < totalPages - 3" class="dots">...</span>

      <!-- Always show last page -->
      <span
        class="page-circle"
        [class.active]="currentPage === totalPages"
        (click)="changePage(totalPages)">
        {{ totalPages }}
      </span>
    </div>

    <button
      class="page-button next"
      [disabled]="currentPage === totalPages"
      (click)="changePage(currentPage + 1)">
      »
    </button>
  </div>
</div>

<!-- 🔙 Retour -->
<a [routerLink]="['/health-dashboard']" class="btn-back-health">
  ⬅️ Back to Health Dashboard
</a>
