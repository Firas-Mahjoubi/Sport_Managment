<!-- 🌌 Background with an image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/injury1.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<!-- 📦 Edit Form -->
<div class="container mt-4">
  <h2 class="text-center">Edit Injury</h2>
  <form [formGroup]="injuryForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label>Date</label>
      <input type="date" class="form-control" formControlName="date" required>
    </div>

    <div class="mb-3">
      <label>Type</label>
      <select class="form-select" formControlName="type">
        <option *ngFor="let t of types" [value]="t">{{ t }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Severity</label>
      <select class="form-select" formControlName="severity">
        <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Status</label>
      <select class="form-select" formControlName="status">
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Player</label>
      <select class="form-select" formControlName="player">
        <option *ngFor="let player of players" [value]="player.id">
          {{ player.firstName }} {{ player.lastName }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
    <a [routerLink]="['/health/injury']" class="btn btn-secondary">Cancel</a>
  </form>
</div>
