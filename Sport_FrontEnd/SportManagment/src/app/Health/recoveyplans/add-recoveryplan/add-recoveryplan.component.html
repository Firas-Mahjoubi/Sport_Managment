<!-- 🌌 Background with an image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/player.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<!-- 📦 Form container -->
<div class="recovery-plan-add-container">
  <h2 class="form-title">➕ Create a Recovery Plan</h2>

  <form [formGroup]="recoveryPlanForm" (ngSubmit)="submit()" class="recovery-plan-form">
    <div>
      <label>Injury concerned:</label>
      <select formControlName="injuryId" required class="form-control">
        <option *ngFor="let injury of injuries" [value]="injury.id">
          {{ injury.description }} ({{ injury.date }})
        </option>
      </select>
      <small *ngIf="recoveryPlanForm.controls['injuryId'].invalid && recoveryPlanForm.controls['injuryId'].touched" class="text-danger">
        ⚠ Select an injury.
      </small>
    </div>

    <div>
      <label>Description:</label>
      <input type="text" formControlName="planDescription" required class="form-control">
      <small *ngIf="recoveryPlanForm.controls['planDescription'].invalid && recoveryPlanForm.controls['planDescription'].touched" class="text-danger">
        ⚠ This field is required.
      </small>
    </div>

    <div>
      <label>Start:</label>
      <input type="date" formControlName="startDate" (change)="validateDates()" required class="form-control">
    </div>

    <div>
      <label>Estimated End:</label>
      <input type="date" formControlName="estimatedEndDate" (change)="validateDates()" required class="form-control">
      <small *ngIf="dateError" class="text-danger">
        ⚠ The end date cannot be before the start date.
      </small>
    </div>

    <div>
      <label>Progress (%):</label>
      <input type="range" formControlName="progress" min="0" max="100" step="1" (input)="updateProgress($event)" class="form-control">
      <span>{{ progressValue }}%</span>
    </div>

    <div>
      <label>Session Frequency (per week):</label>
      <input type="number" formControlName="sessionFrequency" min="1" required class="form-control">
    </div>

    <div>
      <label>Session Duration (minutes):</label>
      <input type="number" formControlName="sessionDuration" min="1" required class="form-control">
    </div>

    <div>
      <label>Plan Type:</label>
      <select formControlName="planType" required class="form-control">
        <option *ngFor="let type of planTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div>
      <label>Next Review Date:</label>
      <input type="date" formControlName="nextReviewDate" required class="form-control">
    </div>

    <div>
      <label>Adjustments:</label>
      <textarea formControlName="adjustments" rows="3" class="form-control"></textarea>
    </div>

    <div>
      <label>Status:</label>
      <select formControlName="planStatus" required class="form-control">
        <option *ngFor="let status of planStatuses" [value]="status">{{ status }}</option>
      </select>
    </div>

    <div class="form-buttons">
      <button type="submit" [disabled]="recoveryPlanForm.invalid || dateError" class="submit-btn">
        ✅ Save
      </button>
      <a [routerLink]="['/list-player']" class="cancel-btn">
        ❌ Cancel
      </a>
    </div>
  </form>
</div>
