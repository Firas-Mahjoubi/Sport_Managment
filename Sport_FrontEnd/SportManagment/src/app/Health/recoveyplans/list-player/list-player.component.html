<!-- 🌌 Arrière-plan avec une image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/player.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="container player-container mt-4">
  <h2 class="title">⚽ Liste des Joueurs</h2>

  <table class="table table-striped table-hover player-table">
    <thead>
      <tr>
        <th>#</th>
        <th>👤 Nom</th>
        <th>🏆 Prénom</th>
        <th>📌 Position</th>
        <th>🎽 Numéro</th>
        <th>✅ Sélection</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let player of players">
        <td>{{ player.id }}</td>
        <td>{{ player.lastName }}</td>
        <td>{{ player.firstName }}</td>
        <td>{{ player.position }}</td>
        <td>{{ player.playerNumber }}</td>
        <td>
          <button class="btn btn-select btn-sm" (click)="selectPlayer(player)">
            ✅ Sélectionner
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 🔘 Boutons en bas -->
<div class="bottom-buttons">
  <!-- 🔙 Bouton Retour au Tableau de Santé -->
  <a [routerLink]="['/health-dashboard']" class="btn-back-health">
    ⬅️ Retour au Tableau de Santé
  </a>

  <!-- 🏥 Bouton Voir Recovery Plan -->
  <button class="btn btn-recovery" (click)="viewRecoveryPlans()">
    🏥 Voir Recovery Plan
  </button>
</div>
