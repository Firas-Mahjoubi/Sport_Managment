<p>edit-recoveryplan works!</p>
<div class="container mt-4">
  <h3>Modifier le plan de récupération</h3>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="name" class="form-label">Nom du plan</label>
      <input type="text" class="form-control" id="name" formControlName="name">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" formControlName="description"></textarea>
    </div>

    <div class="mb-3">
      <label for="duration" class="form-label">Durée (en jours)</label>
      <input type="number" class="form-control" id="duration" formControlName="duration">
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Statut</label>
      <select class="form-select" id="status" formControlName="status">
        <option value="PLANNED">Prévu</option>
        <option value="IN_PROGRESS">En cours</option>
        <option value="COMPLETED">Terminé</option>
        <option value="CANCELLED">Annulé</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="startDate" class="form-label">Date de début</label>
      <input type="date" class="form-control" id="startDate" formControlName="startDate">
    </div>

    <div class="mb-3">
      <label for="endDate" class="form-label">Date de fin</label>
      <input type="date" class="form-control" id="endDate" formControlName="endDate">
    </div>

    <div class="mb-3">
      <label for="progress" class="form-label">Progression (%)</label>
      <input type="number" class="form-control" id="progress" formControlName="progress">
    </div>

    <button type="submit" class="btn btn-primary me-2">Enregistrer</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>

  </form>
</div>
