<!-- 🌌 Arrière-plan -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('assets/player.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<!-- 📦 Conteneur du formulaire -->
<div class="form-container">
  <h4 class="form-title">✏️ Modifier le Plan de Récupération</h4>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="recovery-plan-form">

    <!-- 🔹 Blessure concernée -->
    <div class="form-group">
      <label>Blessure concernée:</label>
      <input type="text" [value]="editForm.get('injuryId')?.value" disabled class="form-control">
    </div>

    <!-- 🔹 Description -->
    <div class="form-group">
      <label>Description:</label>
      <input type="text" formControlName="planDescription" required class="form-control">
    </div>

    <div class="form-row">
      <!-- 🔹 Date de début -->
      <div class="form-group">
        <label>Début:</label>
        <input type="date" formControlName="startDate" (change)="validateDates()" required class="form-control">
      </div>

      <!-- 🔹 Date de fin estimée -->
      <div class="form-group">
        <label>Fin estimée:</label>
        <input type="date" formControlName="estimatedEndDate" (change)="validateDates()" required class="form-control">
        <small *ngIf="dateError" class="text-danger">
          ⚠ La date de fin ne peut pas être avant la date de début.
        </small>
      </div>
    </div>

    <!-- 🔹 Progression -->
    <div class="form-group">
      <label>Progression (%):</label>
      <input type="range" formControlName="progress" min="0" max="100" step="1" (input)="updateProgress($event)" class="form-control">
      <span>{{ progressValue }}%</span>
    </div>

    <div class="form-row">
      <!-- 🔹 Fréquence des séances -->
      <div class="form-group">
        <label>Fréquence des séances:</label>
        <input type="number" formControlName="sessionFrequency" min="1" required class="form-control">
      </div>

      <!-- 🔹 Durée d'une séance -->
      <div class="form-group">
        <label>Durée d'une séance (min):</label>
        <input type="number" formControlName="sessionDuration" min="1" required class="form-control">
      </div>
    </div>

    <div class="form-row">
      <!-- 🔹 Type de Plan -->


      <!-- 🔹 Prochaine révision -->
      <div class="form-group">
        <label>Prochaine révision:</label>
        <input type="date" formControlName="nextReviewDate" required class="form-control">
      </div>
    </div>

    <!-- 🔹 Ajustements -->
    <div class="form-group">
      <label>Ajustements:</label>
      <textarea formControlName="adjustments" rows="3" class="form-control"></textarea>
    </div>

    <!-- 🔹 Statut -->
    

    <!-- 🔘 Boutons -->
    <div class="form-buttons">
      <button type="submit" [disabled]="editForm.invalid || dateError" class="submit-btn">
        ✅ Mettre à jour
      </button>
      <a routerLink="/list-recoveryplan/:playerId" class="cancel-btn">
        ❌ Annuler
      </a>
    </div>

  </form>
</div>
