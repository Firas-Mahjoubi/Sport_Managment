<!-- 🌌 Arrière-plan avec une image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/healthrecord.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="form-container">
  <h4 class="form-title">✏️ Modifier un Health Record</h4>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" class="form-control" formControlName="name">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="form-control" formControlName="date">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fatigue</label>
        <select class="form-control" formControlName="fatigue">
          <option *ngFor="let f of fatigueEnum" [value]="f">{{ f }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>État Physique</label>
        <select class="form-control" formControlName="etatPhysique">
          <option *ngFor="let etat of etatPhysiqueEnum" [value]="etat">{{ etat }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Douleurs Musculaires</label>
        <select class="form-control" formControlName="douleursMusculaires">
          <option *ngFor="let douleur of douleursEnum" [value]="douleur">{{ douleur }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Intensité</label>
        <select class="form-control" formControlName="intensite">
          <option *ngFor="let intens of intensiteEnum" [value]="intens">{{ intens }}</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Statut Joueur</label>
      <select class="form-control" formControlName="statusJoueur">
        <option value="ACTIF">Actif</option>
        <option value="BLESSE">Blessé</option>
        <option value="REPOS">Repos</option>
      </select>
    </div>

    <div class="form-group">
      <label>Commentaire</label>
      <textarea class="form-control" rows="3" formControlName="commentaire"></textarea>
    </div>

    <div class="form-buttons">
      <button type="submit" class="submit-btn" [disabled]="editForm.invalid">💾 Enregistrer</button>
      <a routerLink="/health/health-records" class="cancel-btn">❌ Annuler</a>
    </div>
  </form>
</div>
