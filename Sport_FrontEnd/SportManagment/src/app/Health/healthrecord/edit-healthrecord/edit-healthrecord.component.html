<!-- 🌌 Background with an image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/healthrecord.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<div class="form-container">
  <h4 class="form-title">✏️ Edit a Health Record</h4>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" formControlName="name">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="form-control" formControlName="date">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fatigue</label>
        <select class="form-control" formControlName="fatigue">
          <option *ngFor="let f of fatigueEnum" [value]="f">{{ f }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Physical Condition</label>
        <select class="form-control" formControlName="etatPhysique">
          <option *ngFor="let etat of etatPhysiqueEnum" [value]="etat">{{ etat }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Muscle Pain</label>
        <select class="form-control" formControlName="douleursMusculaires">
          <option *ngFor="let douleur of douleursEnum" [value]="douleur">{{ douleur }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Intensity</label>
        <select class="form-control" formControlName="intensite">
          <option *ngFor="let intens of intensiteEnum" [value]="intens">{{ intens }}</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Player Status</label>
      <select class="form-control" formControlName="statusJoueur">
        <option value="ACTIF">Active</option>
        <option value="BLESSE">Injured</option>
        <option value="REPOS">Rest</option>
      </select>
    </div>

    <div class="form-group">
      <label>Comment</label>
      <textarea class="form-control" rows="3" formControlName="commentaire"></textarea>
    </div>

    <div class="form-buttons">
      <button type="submit" class="submit-btn" [disabled]="editForm.invalid">💾 Save</button>
      <a routerLink="/health/health-records" class="cancel-btn">❌ Cancel</a>
    </div>
  </form>
</div>
