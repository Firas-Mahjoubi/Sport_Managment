<!-- 🌌 Background with an image -->
<div style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url('/assets/healthrecord.jpg') no-repeat center center/cover;
  filter: brightness(0.4);
  z-index: -1;">
</div>

<!-- 📦 Add Form -->
<div class="form-container">
  <h2 class="form-title">➕ Add a Health Record</h2>

  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="healthrecord-form">
    <div class="form-row">
      <!-- Player -->
      <div class="form-group">
        <label for="player">👤 Player:</label>
        <select class="form-control" formControlName="player" (change)="updateName()">
          <option *ngFor="let player of players" [ngValue]="player">
            {{ player.firstName }} {{ player.lastName }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Date -->
      <div class="form-group">
        <label for="date">📅 Date:</label>
        <input type="date" class="form-control" formControlName="date">
      </div>
    </div>

    <div class="form-row">
      <!-- Fatigue -->
      <div class="form-group">
        <label for="fatigue">😴 Fatigue:</label>
        <select class="form-control" formControlName="fatigue">
          <option *ngFor="let f of Fatigue | keyvalue" [value]="f.value">{{ f.value }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Physical Condition -->
      <div class="form-group">
        <label for="etatPhysique">💪 Physical Condition:</label>
        <select class="form-control" formControlName="etatPhysique">
          <option *ngFor="let e of EtatPhysique | keyvalue" [value]="e.value">{{ e.value }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Muscle Pain -->
      <div class="form-group">
        <label for="douleursMusculaires">⚡ Muscle Pain:</label>
        <select class="form-control" formControlName="douleursMusculaires">
          <option *ngFor="let d of DouleursMusculaires | keyvalue" [value]="d.value">{{ d.value }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Intensity -->
      <div class="form-group">
        <label for="intensite">🔥 Intensity:</label>
        <select class="form-control" formControlName="intensite">
          <option *ngFor="let i of Intensite | keyvalue" [value]="i.value">{{ i.value }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <!-- Player Status -->
      <div class="form-group">
        <label for="statusJoueur">🚦 Player Status:</label>
        <select class="form-control" formControlName="statusJoueur">
          <option *ngFor="let s of StatusJoueur | keyvalue" [value]="s.value">{{ s.value }}</option>
        </select>
      </div>
    </div>

    <!-- Comment (full width) -->
    <div class="form-group">
      <label for="commentaire">📝 Comment:</label>
      <textarea class="form-control" formControlName="commentaire"></textarea>
    </div>

    <!-- Buttons -->
    <div class="form-buttons">
      <button type="submit" [disabled]="addForm.invalid" class="submit-btn">
        ✅ Add
      </button>
      <a [routerLink]="['/health/health-records']" class="cancel-btn">❌ Cancel</a>
    </div>
  </form>
</div>
