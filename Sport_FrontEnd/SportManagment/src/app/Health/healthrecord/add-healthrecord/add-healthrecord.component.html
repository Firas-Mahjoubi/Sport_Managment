<form [formGroup]="addForm" (ngSubmit)="onSubmit()">
  <!-- Sélection du joueur -->
  <label for="player">Joueur :</label>
  <select class="form-control" formControlName="player" (change)="updateName()">
    <option *ngFor="let player of players" [ngValue]="player">
      {{ player.firstName }} {{ player.lastName }}
    </option>
  </select>
  <small *ngIf="addForm.get('player')?.invalid && addForm.get('player')?.touched" class="text-danger">
    Sélectionner un joueur est obligatoire.
  </small>

  <!-- Nom (rempli automatiquement) -->
  <label for="name">Nom :</label>
  <input type="text" class="form-control" formControlName="name" readonly>
  <small *ngIf="addForm.get('name')?.invalid" class="text-danger">
    Le nom est requis.
  </small>

  <!-- Date -->
  <label for="date">Date :</label>
  <input type="date" class="form-control" formControlName="date">
  <small *ngIf="addForm.get('date')?.invalid && addForm.get('date')?.touched" class="text-danger">
    La date est obligatoire.
  </small>

  <!-- Fatigue -->
  <label for="fatigue">Fatigue :</label>
  <select class="form-control" formControlName="fatigue">
    <option *ngFor="let f of Fatigue | keyvalue" [value]="f.value">{{ f.value }}</option>
  </select>

  <!-- État Physique -->
  <label for="etatPhysique">État Physique :</label>
  <select class="form-control" formControlName="etatPhysique">
    <option *ngFor="let e of EtatPhysique | keyvalue" [value]="e.value">{{ e.value }}</option>
  </select>

  <!-- Douleurs Musculaires -->
  <label for="douleursMusculaires">Douleurs Musculaires :</label>
  <select class="form-control" formControlName="douleursMusculaires">
    <option *ngFor="let d of DouleursMusculaires | keyvalue" [value]="d.value">{{ d.value }}</option>
  </select>

  <!-- Intensité -->
  <label for="intensite">Intensité :</label>
  <select class="form-control" formControlName="intensite">
    <option *ngFor="let i of Intensite | keyvalue" [value]="i.value">{{ i.value }}</option>
  </select>

  <!-- Statut du joueur -->
  <label for="statusJoueur">Statut du Joueur :</label>
  <select class="form-control" formControlName="statusJoueur">
    <option *ngFor="let s of StatusJoueur | keyvalue" [value]="s.value">{{ s.value }}</option>
  </select>

  <!-- Commentaire -->
  <label for="commentaire">Commentaire :</label>
  <textarea class="form-control" formControlName="commentaire"></textarea>

  <!-- Bouton de soumission -->
  <button type="submit" class="btn btn-primary" [disabled]="addForm.invalid">Ajouter</button>
</form>
