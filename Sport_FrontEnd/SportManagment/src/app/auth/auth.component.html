<div class="bg-img">
  <div class="content">
    <header>{{ isResetPassword ? (isResetToken ? 'Reset Password' : 'Forgot Password') : (isLogin ? 'Sign In' : 'Sign Up') }}</header>

    <p *ngIf="message" [style.color]="messageColor" class="message">{{ message }}</p>

    <!-- Forgot Password Form -->
    <form *ngIf="isResetPassword && !isResetToken" [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()">
      <div class="field">
        <span class="fa fa-envelope"></span>
        <input type="email" formControlName="email" placeholder="Enter your email" required>
      </div>
      <div class="field">
        <input type="submit" value="Send Reset Link">
      </div>
      <div class="switch">
        <a (click)="toggleResetPassword(false)">Back to Login</a>
      </div>
    </form>

    <!-- Reset Password Form -->
    <form *ngIf="isResetPassword && isResetToken" [formGroup]="resetForm" (ngSubmit)="onResetPassword()">
      <div class="field">
        <span class="fa fa-lock"></span>
        <input type="password" formControlName="newPassword" placeholder="New Password" required>
      </div>
      <div class="field">
        <input type="submit" value="Reset Password">
      </div>
      <div class="switch">
        <a (click)="toggleResetPassword(false)">Back to Login</a>
      </div>
    </form>

    <!-- Login Form -->
    <form *ngIf="!isResetPassword && isLogin" [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <span class="fa fa-envelope"></span>
        <input formControlName="email" placeholder="Email">
      </div>
      <div class="field">
        <span class="fa fa-lock"></span>
        <input type="password" formControlName="password" placeholder="Mot de passe">
      </div>
      <div class="pass">
        <a (click)="toggleResetPassword(true)">Forgot Password?</a>
      </div>
      <div class="field">
        <input type="submit" value="Se connecter">
      </div>
      <div class="switch">
        Don't have an account? <a (click)="toggleForm()">Sign Up</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form *ngIf="!isResetPassword && !isLogin" [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <span class="fa fa-user"></span>
        <input formControlName="name" placeholder="Full Name">
      </div>
      <div class="field">
        <span class="fa fa-envelope"></span>
        <input formControlName="email" placeholder="Email">
      </div>
      <div class="field">
        <span class="fa fa-lock"></span>
        <input type="password" formControlName="password" placeholder="Password">
      </div>
      <div class="field">
        <span class="fa fa-phone"></span>
        <input formControlName="phoneNumber" placeholder="Phone Number">
      </div>
      <div class="field">
        <input type="submit" value="Sign Up">
      </div>
      <div class="switch">
        Already have an account? <a (click)="toggleForm()">Sign In</a>
      </div>
    </form>
  </div>
</div>
