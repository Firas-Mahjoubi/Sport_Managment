<body>
  <div class="container">
    <h2 class="page-title">📂 My Tactics</h2>

    <!-- Search Bar -->
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>🔍 Search Tactics</mat-label>
        <input 
          matInput
          type="text" 
          [(ngModel)]="searchQuery" 
          (keyup)="filterTactics()"
          placeholder="Search a tactic..."
        />
      </mat-form-field>
    </div>

    <!-- Folder List -->
    <div class="folder-list">
      <div *ngFor="let tactic of filteredTactics; trackBy: trackById" class="folder card">
        <div class="card-body folder-content" (click)="tactic.id !== undefined && openTacticFolder(tactic.id)">
          <img src="assets/images/folder.png" alt="Folder Icon" class="folder-icon">
          <div class="folder-details">
            <h3>{{ tactic.name }}</h3>
            <p><strong>Formation:</strong> {{ tactic.formation }}</p>
            <p><strong>Training Focus:</strong> {{ tactic.trainingFocus }}</p>
          </div>
        </div>

        <!-- Three Dots Menu -->
        <div class="dropdown">
          <button class="menu-button" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <p>...</p> 
         </button>
          <ul class="dropdown-menu">
            <li>
              <button class="dropdown-item edit-btn" (click)="renameTactic(tactic)">
                <mat-icon>edit</mat-icon> Rename
              </button>
            </li>
            <li>
              <button class="dropdown-item delete-btn" (click)="tactic.id !== undefined && deleteTactic(tactic.id)">
                <mat-icon>delete</mat-icon> Delete
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Floating Add Button -->
    <div class="add-button">
      <button mat-fab color="primary" (click)="openCreateDialog()">
        <mat-icon>+</mat-icon>
      </button>
    </div>
  </div>
</body>
