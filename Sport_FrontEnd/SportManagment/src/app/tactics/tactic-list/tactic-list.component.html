<body>
  <div class="container">
    <h2 class="page-title">📂 My Tactics</h2>

    <!-- Search Bar -->
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>🔍 Search</mat-label>
        <input 
          matInput
          type="text" 
          [(ngModel)]="searchQuery" 
          (keyup)="filterTactics()"
          placeholder="Search a tactic..."
        />
      </mat-form-field>
    </div>

    <!-- Folder List -->
    <div class="folder-list">
      <div *ngFor="let tactic of filteredTactics; trackBy: trackById" class="folder">
        <div class="folder-content" (click)="tactic.id !== undefined && openTacticFolder(tactic.id)">
          <img src="assets/images/folder.png" alt="Folder Icon" class="folder-icon">
          <div class="folder-details">
            <h3>{{ tactic.name }}</h3>
            <p><strong>Formation:</strong> {{ tactic.formation }}</p>
            <p><strong>Training Focus:</strong> {{ tactic.trainingFocus }}</p>
          </div>
        </div>

        <!-- Three Dots Menu -->
        <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-button">
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="renameTactic(tactic)">
            <mat-icon>edit</mat-icon> Rename
          </button>
          <button mat-menu-item (click)="tactic.id !== undefined && deleteTactic(tactic.id)" class="delete-button">
            <mat-icon>delete</mat-icon> Delete
          </button>
        </mat-menu>
      </div>
    </div>

    <!-- Floating Add Button -->
    <div class="add-button">
      <button mat-fab color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
</body>
