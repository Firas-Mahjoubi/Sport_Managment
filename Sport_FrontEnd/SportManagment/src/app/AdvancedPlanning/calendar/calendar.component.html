<div class="calendar" [class.dark-mode]="isDarkMode">
  <!-- Bouton "Add Event" -->
  <div class="add-event-container">
    <button mat-raised-button (click)="openEventForm()">
      Add Event
    </button>
    <button mat-raised-button (click)="openSessionForm()" style="margin-left: 10px;">
      Add Session
    </button>
    
  </div>

  <!-- En-tête du calendrier -->
  <div class="calendar-header">
    <button mat-icon-button (click)="viewMode === 'day' ? prevMonth() : viewMode === 'month' ? prevMonth() : prevYear()">
      <fa-icon [icon]="faChevronLeft"></fa-icon>
    </button>
    <h2>
      <span *ngIf="viewMode === 'day'">{{ selectedDate ? selectedDate.toDateString() : 'Select a day' }}</span>
      <span *ngIf="viewMode === 'month'">{{ getMonthName() }} {{ getYear() }}</span>
      <span *ngIf="viewMode === 'year'">{{ getYear() }}</span>
    </h2>
    <button mat-icon-button (click)="viewMode === 'day' ? nextMonth() : viewMode === 'month' ? nextMonth() : nextYear()">
      <fa-icon [icon]="faChevronRight"></fa-icon>
    </button>
    <!-- Bouton pour basculer entre les modes clair et sombre -->
    <button mat-icon-button (click)="toggleDarkMode()">
      {{ isDarkMode ? '🌜' : '🌞' }}
    </button>
  </div>

  <!-- Sélecteur de vue -->
  <div class="view-selector">
    <button mat-button (click)="viewMode = 'day'" [class.active]="viewMode === 'day'">Day</button>
    <button mat-button (click)="viewMode = 'month'" [class.active]="viewMode === 'month'">Month</button>
    <button mat-button (click)="viewMode = 'year'" [class.active]="viewMode === 'year'">Year</button>
  </div>

  <!-- Vue Jour -->
  <div *ngIf="viewMode === 'day'" class="day-view">
    <div class="day-header">
      <h3>{{ selectedDate ? selectedDate.toDateString() : 'Select a day' }}</h3>
    </div>
    <!-- Afficher les événements pour ce jour -->
    <div *ngFor="let event of getEventsForDay(selectedDate ? selectedDate.getDate() : null)" class="event">
      {{ event.name }}
    </div>
  </div>

  <!-- Vue Mois -->
  <div *ngIf="viewMode === 'month'" class="month-view">
    <div class="day-names">
      <div *ngFor="let day of dayNames" class="day-name">{{ day }}</div>
    </div>
    <div *ngFor="let week of weeks" class="week">
      <div
        *ngFor="let day of week"
        class="day"
        [class.empty]="day === null"
        [class.selected]="selectedDate && day === selectedDate.getDate()"
        (click)="selectDay(day)"
      >
        {{ day }}
        <!-- Afficher les événements pour ce jour -->
        <div *ngFor="let event of getEventsForDay(day)" class="event">
          {{ event.nameEvent }}
        </div>
      </div>
    </div>
  </div>

  <!-- Vue Année -->
  <div *ngIf="viewMode === 'year'" class="year-view">
    <div class="year-grid">
      <div *ngFor="let month of monthNames; let i = index" class="month" (click)="selectMonth(i)">
        {{ month }}
      </div>
    </div>
  </div>
</div>
