<mat-dialog-content>
  <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="event-form">

    <!-- Title -->
    <h2 class="form-title">Create Your Event 🚀</h2>

    <!-- General Information -->
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>Event Name</mat-label>
        <input matInput formControlName="nameEvent" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
    </div>

    <!-- Date & Time -->
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Time</mat-label>
        <input matInput type="time" formControlName="time" required>
      </mat-form-field>
    </div>

    <!-- Location -->
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>Location</mat-label>
        <input matInput formControlName="address" required>
      </mat-form-field>
    </div>

    <!-- Event Type -->
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>Event Type</mat-label>
        <mat-select formControlName="typeEvent" required>
          <mat-option *ngFor="let type of eventTypes" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button mat-button type="button" (click)="onCancel()" class="btn-cancel">Cancel</button>
      <button mat-flat-button color="primary" type="submit" class="btn-save">Save Event</button>
    </div>

  </form>
</mat-dialog-content>
